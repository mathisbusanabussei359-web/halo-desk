name: Builds de bureau
on:
  push:
    tags: ['v*']
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macOS Intel, runner: macos-15-intel, arch: x64}
          - {name: macOS Apple Silicon, runner: macos-15, arch: arm64}
          - {name: Windows x64, runner: windows-2025, arch: x64}
          - {name: Linux x64, runner: ubuntu-24.04, arch: x64}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publier les installateurs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* --verify-tag --title "Halo Desk $TAG" --generate-notes
          fi
