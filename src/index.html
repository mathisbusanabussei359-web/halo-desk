<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Halo Desk</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="renderer.js"></script>
</head>
<body>
  <main id="island">
    <button id="toggle" type="button" aria-expanded="false" aria-controls="panel">
      <img class="mascot avatar" src="halo-bot.webp" alt="" width="42" height="42" draggable="false">
      <span id="title">Halo Desk</span>
      <span id="clock"></span>
      <span id="chevron" aria-hidden="true">⌄</span>
    </button>
    <div id="panel" hidden>
      <div class="bot-card">
        <img class="mascot" src="halo-bot.webp" alt="Halo, le petit robot" width="70" height="70" draggable="false">
        <div>
          <strong>Halo</strong>
          <div id="mood">Prêt à t’aider</div>
        </div>
      </div>
      <nav aria-label="Vues">
        <button id="assistant-tab" aria-pressed="true">Assistant</button>
        <button id="notes-tab" aria-pressed="false">Notes</button>
        <button id="tasks-tab" aria-pressed="false">Tâches</button>
      </nav>
      <section id="assistant">
        <div class="quick" aria-label="Actions rapides">
          <button data-command="focus 25m">Focus 25 min</button>
          <button data-command="minuteur 5m">Minuteur 5 min</button>
          <button data-command="pause" id="pause" hidden>Pause</button>
          <button data-command="annuler" id="cancel" hidden>Annuler</button>
        </div>
        <div id="messages" role="log" aria-label="Conversation" tabindex="0">
          <p class="reply">Salut, je suis Halo. Lance un minuteur, ajoute une note ou tape « aide » pour voir les commandes.</p>
        </div>
      </section>
      <section id="notes" aria-label="Notes enregistrées" hidden></section>
      <section id="tasks" aria-label="Tâches à faire" hidden></section>
      <form id="command">
        <label for="input" class="sr-only">Commande</label>
        <input id="input" placeholder="Ex. note Appeler Léa" maxlength="1200" autocomplete="off">
        <button id="send" type="submit" aria-label="Envoyer">↑</button>
      </form>
      <footer>
        <span id="shortcut"></span>
        <button id="hide" type="button">Masquer</button>
        <button id="quit" type="button">Quitter</button>
      </footer>
    </div>
  </main>
</body>
</html>
