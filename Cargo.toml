[package]
name = "halo-desk"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Capsule de bureau et assistant local"

[dependencies]
chrono = "0.4"
dirs = "6"
device_query = "4"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
global-hotkey = "0.7"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
notify-rust = "4"
open = "5"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }
rfd = "0.15"
rodio = { version = "0.20", features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }
plist = "1"

[profile.dev]
debug = 0
incremental = false
